[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opm"
version = "0.1.0"
description = "Command line tool and MCP server for the OpenProject API v3"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
opm = "opm.cli:main"
opm-mcp = "opm.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
